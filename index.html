<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3146"><title>Fart Frenzy 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#0b3146}#view{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;text-shadow:0 2px 5px #123}#hud>div{background:#123a52aa;border:1px solid #ffffff33;padding:8px 11px;border-radius:14px;font-size:13px;font-weight:800;backdrop-filter:blur(6px)}#controls{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none}button{font:inherit;cursor:pointer}#fart{pointer-events:auto;border:4px solid #ffffffa0;background:linear-gradient(145deg,#c9fa55,#49c953);color:#143c28;width:120px;height:120px;border-radius:50%;box-shadow:0 9px 0 #2a793e,0 15px 25px #0006;font-weight:1000;font-size:22px;touch-action:none;user-select:none}#fart:active{transform:translateY(5px);box-shadow:0 4px 0 #2a793e}#fart:disabled{opacity:.6}#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#072438d9,#083a42dd);padding:18px;overflow:auto;touch-action:pan-y}#panel{width:min(430px,100%);border:2px solid #ffffff30;border-radius:28px;background:#153d54;padding:24px;box-shadow:0 20px 60px #0007;text-align:center}h1{font-size:clamp(32px,8vw,48px);margin:4px 0;color:#dbff78;line-height:1.1}p{line-height:1.45;color:#d4ebf2}input{width:100%;padding:13px;border-radius:12px;border:2px solid #ffffff44;background:#0b2b40;color:white;font-size:17px;margin:7px 0;touch-action:manipulation}#panel button{padding:13px;border:0;border-radius:13px;font-weight:800;background:#d7fb6b;color:#173a25;margin:7px 4px;min-width:125px}#panel button.secondary{background:#7ad6ef;color:#143344}#msg{min-height:22px;color:#ffcc8c;font-size:13px}#roomTag{font-weight:900;color:#eaff8c}#note{position:fixed;top:80px;left:10%;right:10%;text-align:center;font-weight:900;font-size:21px;text-shadow:0 3px 8px #000;pointer-events:none}#footer{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:10px;color:#ffffffa0;pointer-events:none}#offline{position:fixed;top:60px;right:12px;border-radius:12px;background:#15445bcc;padding:6px 10px;font-size:11px}#sound{position:fixed;bottom:calc(35px + env(safe-area-inset-bottom));right:16px;border:0;background:#15445bd9;color:white;padding:12px;border-radius:50%;font-size:20px}#share{position:fixed;bottom:calc(35px + env(safe-area-inset-bottom));left:16px;border:0;background:#15445bd9;color:white;padding:12px;border-radius:50%;font-size:20px}#menu[hidden],#controls[hidden],#hud[hidden],#note[hidden],#offline[hidden],#share[hidden]{display:none!important}
</style></head><body><canvas id="view"></canvas><div id="hud" hidden><div id="roomInfo">SOLO</div><div id="health">❤️❤️❤️</div><div id="progress">0% 🌊</div></div><div id="note" hidden></div><div id="offline" hidden>SOLO DEMO</div><div id="controls" hidden><button id="fart">💨 FART!</button></div><button id="sound" hidden>🔊</button><button id="share" hidden>🔗</button><div id="footer">FART FRENZY 3D · ORIGINAL PROTOTYPE</div><div id="menu"><div id="panel"><div style="font-size:50px">🦛💨🛶</div><h1>FART<br>FRENZY 3D</h1><p>Fart your raft through a wild river! Play solo now or join up to 8 friends online when hosted.</p><input id="name" placeholder="Your nickname" maxlength="16" value="Captain Toot"><div><button id="solo">▶ PLAY SOLO</button><button id="create">🌐 CREATE ROOM</button></div><input id="code" placeholder="5-letter room code" maxlength="5" autocapitalize="characters"><button class="secondary" id="join">JOIN FRIENDS</button><p id="msg"></p><small style="color:#a7d2de">Use headphones for maximum silliness 🎧</small></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),menu=$('menu'),canvas=$('view'),hud=$('hud'),controls=$('controls'),fart=$('fart'),note=$('note');let THREE3=window.THREE,scene,camera,renderer,raft,animals=[],smokes=[],rocks=[],water,clock,mode='menu',socket=null,mySeat=0,room='',players=[],health=3,progress=0,muted=false,lastBoost=0,lastTime=0,solo={x:0,z:0,angle:0,vx:0,vz:0,spin:0},invuln=0;const colors=[0xf4b469,0xf5a0ba,0x8de3b6,0xb9a6ff,0xffd66e,0x78d4e6,0xff9079,0xc8e785];
function mesh(g,m,x=0,y=0,z=0){let o=new THREE3.Mesh(g,m);o.position.set(x,y,z);return o}function mat(c,rough=.85){return new THREE3.MeshStandardMaterial({color:c,roughness:rough})}function box(w,h,d,c,x,y,z){return mesh(new THREE3.BoxGeometry(w,h,d),mat(c),x,y,z)}function ball(r,c,x,y,z){return mesh(new THREE3.SphereGeometry(r,12,10),mat(c),x,y,z)}
function init(){if(!THREE3){$('msg').textContent='3D library could not load. Please connect to the internet and reload.';return}scene=new THREE3.Scene();scene.background=new THREE3.Color(0x86d9fa);scene.fog=new THREE3.Fog(0x86d9fa,45,120);camera=new THREE3.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);renderer=new THREE3.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE3.SRGBColorSpace;scene.add(new THREE3.HemisphereLight(0xffffff,0x48867c,2.1));let sun=new THREE3.DirectionalLight(0xffffff,2.3);sun.position.set(-10,25,5);scene.add(sun);water=mesh(new THREE3.PlaneGeometry(200,700),new THREE3.MeshStandardMaterial({color:0x36c3df,roughness:.55,metalness:.05}));water.rotation.x=-Math.PI/2;water.position.z=125;scene.add(water);for(let i=0;i<60;i++){let z=i*7-35;for(let side of [-1,1]){let island=mesh(new THREE3.CylinderGeometry(1.6,2.2,1,8),mat(i%2?0x7bd65c:0x68c952),side*(10.5+Math.random()*4),-.25,z);scene.add(island);if(i%3===0){let trunk=box(.35,2,.35,0x976336,island.position.x,1.1,z);scene.add(trunk);let leaves=ball(1.2,0x3eaa5d,island.position.x,2.5,z);scene.add(leaves)}}}raft=new THREE3.Group();scene.add(raft);raft.add(box(3.6,.35,4.6,0x98602f,0,.35,0));for(let i=0;i<5;i++)raft.add(box(.64,.12,4.7,i%2?0xb87c3e:0xd09553,-1.35+i*.68,.58,0));for(let i=0;i<8;i++){let a=new THREE3.Group();let x=(i%4-1.5)*.86,z=(i<4?-.95:1);a.position.set(x,.85,z);a.add(ball(.43,colors[i],0,.38,0));a.add(ball(.24,colors[i],0,.85,.06));a.add(ball(.13,0xffffff,-.11,.9,.24));a.add(ball(.13,0xffffff,.11,.9,.24));a.add(ball(.06,0x172b30,-.11,.9,.35));a.add(ball(.06,0x172b30,.11,.9,.35));a.add(ball(.15,colors[i],-.28,1.05,0));a.add(ball(.15,colors[i],.28,1.05,0));raft.add(a);animals.push(a)}for(let i=0;i<12;i++){let z=15+i*19,x=Math.sin(i*7.1)*4.3;let rock=mesh(new THREE3.DodecahedronGeometry(1.4,0),mat(0x687d83),x,.6,z);rock.scale.y=.65;scene.add(rock);rocks.push(rock)}let finish=box(18,.2,.6,0xffe35d,0,.15,250);scene.add(finish);clock=new THREE3.Clock();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop)}
function smoke(seat){if(!scene)return;for(let i=0;i<14;i++){let m=ball(.13+Math.random()*.16,Math.random()>.5?0x9cfc61:0xd9ff91,0,0,0);let a=raft.localToWorld(new THREE3.Vector3((seat%4-1.5)*.86,.7,(seat<4?-.95:1)-.7));m.position.copy(a);m.userData={life:1,vx:(Math.random()-.5)*.15,vy:Math.random()*.1,vz:-Math.random()*.18};scene.add(m);smokes.push(m)}}
function sound(){if(muted)return;try{const ac=window._audio||(window._audio=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(125,ac.currentTime);o.frequency.exponentialRampToValueAtTime(42,ac.currentTime+.22);g.gain.setValueAtTime(.14,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.28);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3)}catch(e){}}
function burst(seat){smoke(seat);sound();for(let a of animals)a.scale.set(1.1,.83,1.1);setTimeout(()=>{for(let a of animals)a.scale.set(1,1,1)},170)}
function begin(){menu.hidden=true;hud.hidden=false;controls.hidden=false;$('sound').hidden=false;$('share').hidden=mode==='solo';$('offline').hidden=mode!=='solo';note.hidden=true;lastBoost=0;updateHud()}
function updateHud(){$('roomInfo').textContent=mode==='solo'?'SOLO DEMO':`ROOM ${room} · ${players.length}/8`;$('health').textContent='❤️'.repeat(Math.max(0,health));$('progress').textContent=progress+'% 🌊'}
function message(t){note.textContent=t;note.hidden=false;setTimeout(()=>{if(note.textContent===t)note.hidden=true},2500)}
function boost(){if(mode==='menu')return;const now=Date.now();if(now-lastBoost<1800)return;lastBoost=now;if(mode==='solo'){solo.vx+=Math.sin(solo.angle)*.58;solo.vz+=Math.cos(solo.angle)*.58;solo.spin+=(Math.random()>.5?1:-1)*.043;burst(0)}else if(socket&&socket.readyState===1)socket.send(JSON.stringify({type:'boost'}))}
function resetSolo(){solo={x:0,z:0,angle:0,vx:0,vz:0,spin:0};health=3;progress=0;invuln=0;updateHud()}
function loop(){requestAnimationFrame(loop);if(!renderer)return;let dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000;if(mode==='solo'){solo.x+=solo.vx*dt*1.7;solo.z+=solo.vz*dt*1.7;solo.angle+=solo.spin*dt*16;solo.vx*=Math.pow(.973,dt*16);solo.vz*=Math.pow(.973,dt*16);solo.spin*=Math.pow(.92,dt*16);progress=Math.min(100,Math.floor(Math.max(0,solo.z)/2.5));if(Math.abs(solo.x)>7){solo.x=Math.sign(solo.x)*7;solo.vx*=-.5;hit()}for(let r of rocks)if(Math.abs(solo.x-r.position.x)<1.55&&Math.abs(solo.z-r.position.z)<1.55)hit();if(progress>=100){mode='menu';menu.hidden=false;controls.hidden=true;hud.hidden=true;$('msg').textContent='🏆 YOU WIN! Try again or create an online room.'}raft.position.set(solo.x,Math.sin(t*2)*.09,solo.z);raft.rotation.y=solo.angle;updateHud()}else if(mode==='online'){raft.position.lerp(new THREE3.Vector3(net.x,Math.sin(t*2)*.09,net.z),.2);raft.rotation.y+=((net.angle-raft.rotation.y+Math.PI*3)%(Math.PI*2)-Math.PI)*.18}for(let i=0;i<animals.length;i++){animals[i].visible=mode==='solo'?i===0:players.some(p=>p.seat===i);animals[i].position.y=.85+Math.sin(t*3+i)*.035}for(let i=smokes.length-1;i>=0;i--){let s=smokes[i];s.userData.life-=dt*1.8;s.position.x+=s.userData.vx;s.position.y+=s.userData.vy;s.position.z+=s.userData.vz;s.scale.setScalar(1+(1-s.userData.life)*2);s.material.transparent=true;s.material.opacity=Math.max(0,s.userData.life);if(s.userData.life<=0){scene.remove(s);s.geometry.dispose();s.material.dispose();smokes.splice(i,1)}}camera.position.lerp(new THREE3.Vector3(raft.position.x,12,raft.position.z-16),.08);camera.lookAt(raft.position.x,0,raft.position.z+8);let remain=Math.max(0,1800-(Date.now()-lastBoost));fart.disabled=remain>0;fart.textContent=remain>0?`💨 ${(remain/1000).toFixed(1)}s`:'💨 FART!';renderer.render(scene,camera)}
function hit(){if(Date.now()<invuln)return;invuln=Date.now()+1600;health--;solo.vz*=-.5;message('💥 OUCH!');if(health<=0){resetSolo();message('💦 RAFT RESCUED!')}}
let net={x:0,z:0,angle:0};function connect(action){const protocol=location.protocol==='https:'?'wss':'ws';let url=protocol+'://'+location.host;try{socket=new WebSocket(url)}catch(e){$('msg').textContent='Online rooms require a hosted server.';return}socket.onopen=()=>socket.send(JSON.stringify({type:action,name:$('name').value,room:$('code').value}));socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error'){$('msg').textContent=m.message;return}if(m.type==='joined'){mode='online';room=m.room;mySeat=m.seat;begin();message('Room '+room+' — share this code!')}if(m.type==='state'){players=m.players;net=m.raft;health=m.health;progress=m.progress;updateHud();if(m.finished){message('🏆 TEAM FINISHED!');setTimeout(()=>{if(socket?.readyState===1)socket.send(JSON.stringify({type:'restart'}))},2500)}}if(m.type==='burst'){burst(m.seat)}};socket.onerror=()=>{$('msg').textContent='Could not connect. Online rooms need a Node.js host.'};socket.onclose=()=>{if(mode==='online'){mode='menu';menu.hidden=false;hud.hidden=true;controls.hidden=true;$('msg').textContent='Connection lost. Rejoin to continue.'}}}
$('solo').onclick=()=>{mode='solo';resetSolo();begin()};$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');fart.addEventListener('pointerdown',e=>{e.preventDefault();boost()});$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};$('share').onclick=()=>{let text=`Join my Fart Frenzy 3D room ${room}: ${location.href}`;if(navigator.share)navigator.share({text,url:location.href}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>message('Invite copied!'))};init();})();
</script></body></html>
