<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#103b53"><title>Fart Frenzy 3D — Mobile Edition</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#103b53;color:white;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;font-size:13px;font-weight:800;text-shadow:0 1px 4px #123}#hud span{background:#06344dbb;padding:8px 10px;border-radius:12px}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 25px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#stick{width:145px;height:145px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 25px #0003}#knob{position:absolute;left:50%;top:50%;width:67px;height:67px;margin:-33.5px;border-radius:50%;background:#f2f9ffbb;border:3px solid white;box-shadow:0 3px 12px #0005;transform:translate(0px,0px)}#fart{pointer-events:auto;touch-action:none;border:4px solid #f6ffcf;border-radius:50%;width:120px;height:120px;background:linear-gradient(#d5ff6a,#62db54);font-weight:1000;font-size:22px;color:#184328;box-shadow:0 8px 0 #318541,0 13px 20px #0005}#fart:active{transform:translateY(4px)}#tip{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 5px);width:100%;text-align:center;font-size:11px;color:#e4f8ffbd;pointer-events:none}#overlay{position:fixed;inset:0;background:#092f42e8;display:grid;place-items:center;padding:22px;touch-action:manipulation}#panel{width:min(410px,100%);background:#1c5063;border:2px solid #ffffff44;border-radius:25px;padding:25px;text-align:center;box-shadow:0 15px 40px #0008}h1{font-size:40px;line-height:1.1;color:#d8ff73;margin:8px 0}p{line-height:1.5;color:#d9f1f7}#play{border:0;border-radius:14px;padding:15px 30px;background:#d8ff73;color:#16412c;font-size:20px;font-weight:900}#bottom[hidden],#hud[hidden],#overlay[hidden]{display:none!important}
</style></head><body><canvas id="game"></canvas><div id="hud" hidden><span id="distance">DISTANCE 0m</span><span id="hearts">❤️❤️❤️</span><span id="cooldown">💨 READY</span></div><div id="bottom" hidden><div id="stick"><div id="knob"></div></div><button id="fart">💨 FART!</button></div><div id="tip">LEFT THUMB: STEER · RIGHT THUMB: FART BOOST</div><div id="overlay"><div id="panel"><div style="font-size:55px">🦛💨🛶</div><h1>FART FRENZY 3D</h1><p>Mobile Edition · Steer your raft with your left thumb. Tap FART to blast forward. Dodge rocks and travel as far as you can!</p><button id="play">▶ PLAY</button><p style="font-size:12px">Solo mobile prototype · Online multiplayer comes later</p></div></div><script>
(()=>{'use strict';const $=s=>document.getElementById(s),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),stick=$('stick'),knob=$('knob');let W=0,H=0,dpr=1,active=false,last=0,travel=0,health=3,boost=0,inv=0,spawn=0,rocks=[],particles=[],raf={x:0,vx:0,angle:0},joy={x:0,y:0},pid=null,seed=7;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function joystick(e){e.preventDefault();const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy)||1,scale=Math.min(1,mag/51);joy.x=dx/mag*scale;joy.y=dy/mag*scale;knob.style.transform=`translate(${joy.x*48}px,${joy.y*48}px)`}stick.addEventListener('pointerdown',e=>{pid=e.pointerId;stick.setPointerCapture(pid);joystick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===pid)joystick(e)});function release(e){if(e.pointerId!==pid)return;pid=null;joy.x=joy.y=0;knob.style.transform='translate(0px,0px)'}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);function fart(){if(!active||boost>0)return;boost=1.3;for(let i=0;i<24;i++)particles.push({x:raf.x,y:0,vx:(rand()-.5)*5,vy:rand()*4+1,life:1,size:rand()*11+7});try{const ac=new(window.AudioContext||window.webkitAudioContext)(),osc=ac.createOscillator(),gain=ac.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(115,ac.currentTime);osc.frequency.exponentialRampToValueAtTime(45,ac.currentTime+.24);gain.gain.setValueAtTime(.12,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.3);osc.connect(gain).connect(ac.destination);osc.start();osc.stop(ac.currentTime+.31);setTimeout(()=>ac.close(),450)}catch(e){}}$('fart').addEventListener('pointerdown',e=>{e.preventDefault();fart()});function start(){active=true;last=performance.now();travel=0;health=3;boost=0;inv=0;spawn=0;rocks=[];particles=[];raf={x:0,vx:0,angle:0};$('overlay').hidden=true;$('hud').hidden=false;$('bottom').hidden=false;$('tip').hidden=false}$('play').onclick=start;function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}function draw(){const cx=W/2,cy=H*.58,scale=Math.max(.8,Math.min(1.3,W/390)),river=W*.82;ctx.fillStyle='#4e9c6d';ctx.fillRect(0,0,W,H);polygon([[cx-river*.49,0],[cx+river*.49,0],[cx+river*.67,H],[cx-river*.67,H]],'#1c9fba');for(let i=0;i<18;i++){let z=((i*117+travel*13)%(H+180))-90,x=cx+Math.sin(i*22.7)*river*.36;ellipse(x,z,18,3,'#b0f7ff55')}for(let i=0;i<16;i++){let y=((i*107+travel*10)%(H+120))-60,side=i%2?-1:1,x=cx+side*(river*.56+10+rand()*0);ellipse(x,y,17,8,'#286847');ellipse(x,y-10,13,17,'#26743d')}rocks.forEach(r=>{const y=cy-(r.z-travel)*2.3*scale,x=cx+(r.x-raf.x*.18)*scale;if(y< -70||y>H+70)return;ellipse(x,y+12,24*scale,10*scale,'#123c5077');polygon([[x-23*scale,y+5*scale],[x-17*scale,y-17*scale],[x+7*scale,y-24*scale],[x+23*scale,y-4*scale],[x+16*scale,y+13*scale]],'#697b85')});ctx.save();ctx.translate(cx+raf.x*scale,cy);ctx.rotate(raf.angle);ellipse(0,22*scale,51*scale,19*scale,'#083c4d88');polygon([[-44,-12],[40,-12],[52,15],[-51,15]].map(([x,y])=>[x*scale,y*scale]),'#835030');polygon([[-35,-13],[31,-13],[38,8],[-39,8]].map(([x,y])=>[x*scale,y*scale]),'#c88a4c');ellipse(0,-9*scale,24*scale,23*scale,'#b69ac9');ellipse(0,-28*scale,23*scale,20*scale,'#d4b1df');ellipse(-17*scale,-41*scale,9*scale,11*scale,'#d4b1df');ellipse(17*scale,-41*scale,9*scale,11*scale,'#d4b1df');ellipse(-8*scale,-29*scale,3*scale,3*scale,'#222');ellipse(8*scale,-29*scale,3*scale,3*scale,'#222');ellipse(0,-20*scale,11*scale,7*scale,'#a77eb6');ctx.restore();particles.forEach(p=>{ellipse(cx+(p.x-raf.x*.15)*scale,cy+27*scale+p.y*scale,p.size*p.life,p.size*p.life*.7,`rgba(177,244,97,${p.life*.6})`)});if(inv>0&&Math.floor(inv*10)%2)ctx.fillStyle='#ffffff22',ctx.fillRect(0,0,W,H)}function update(dt){if(!active)return;const speed=boost>0?19:9;travel+=dt*speed;raf.vx+=(joy.x*32-raf.vx*5)*dt;raf.x+=raf.vx*dt;raf.x=Math.max(-W*.32,Math.min(W*.32,raf.x));raf.angle+=(joy.x*.18-raf.angle)*Math.min(1,dt*7);boost=Math.max(0,boost-dt);inv=Math.max(0,inv-dt);spawn+=dt;if(spawn>1.15){spawn=0;rocks.push({x:(rand()-.5)*W*.58,z:travel+H/2.3+35,hit:false})}for(const r of rocks){if(!r.hit&&Math.abs(r.z-travel)<18&&Math.abs(r.x-raf.x)<42&&inv<=0){r.hit=true;health--;inv=1.5;if(health<=0){active=false;$('overlay').hidden=false;$('panel').querySelector('p').textContent=`You traveled ${Math.floor(travel)} meters! Try again and dodge those rocks.`;$('play').textContent='↻ PLAY AGAIN';$('bottom').hidden=true}}}rocks=rocks.filter(r=>r.z>travel-80);particles.forEach(p=>{p.x+=p.vx*dt*18;p.y+=p.vy*dt*24;p.life-=dt*1.3});particles=particles.filter(p=>p.life>0);$('distance').textContent=`DISTANCE ${Math.floor(travel)}m`;$('hearts').textContent='❤️'.repeat(Math.max(0,health));$('cooldown').textContent=boost>0?'💨 BOOST!':'💨 READY'}function frame(t){const dt=Math.min((t-last)/1000||.016,.04);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());})();
</script></body></html>
